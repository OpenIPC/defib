name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # The workflow itself injects the proxy config, so redeploy when it changes.
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OpenIPC's cors-proxy requires an HMAC signature from non-localhost
      # origins. Inject the shared key here so it never lands in the repo; the
      # committed web/config.js keeps an empty key for local development, where
      # the worker exempts localhost anyway. If the secret is unset the key
      # stays empty and the download falls through to the other sources.
      - name: Inject CORS proxy configuration
        env:
          CORS_PROXY_HMAC_KEY: ${{ secrets.CORS_PROXY_HMAC_KEY }}
        run: |
          {
            echo "// Generated by .github/workflows/pages.yml — do not edit."
            echo "const CORS_PROXY_URL = 'https://cors-proxy.joseph-nef.workers.dev';"
            printf "const CORS_PROXY_HMAC_KEY = '%s';\n" "$CORS_PROXY_HMAC_KEY"
          } > web/config.js
          if [ -z "$CORS_PROXY_HMAC_KEY" ]; then
            echo "::warning::CORS_PROXY_HMAC_KEY is not set — U-Boot downloads will fall back to public CORS proxies."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
